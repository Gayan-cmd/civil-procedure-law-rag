[project]
name = "cpa"
version = "0.1.0"
description = "Retrieval and generation logic for the Civil Procedure Law Assistant"
requires-python = ">=3.12,<3.13"
dependencies = [
    "langchain>=0.3",
    "langchain-huggingface>=0.1",
    "langchain-chroma>=1.0",
    "langchain-groq>=0.2",
    "chromadb>=0.5",
    "sentence-transformers>=3.0",
    "transformers>=4.44",
    "accelerate>=0.33",
    "huggingface_hub>=0.24",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
